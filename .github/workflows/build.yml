name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf binary_patcher_rs_toolkit_linux.tar.gz binary_patcher_rs
          - os: macos
            runner: macos-latest
            ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf binary_patcher_rs_toolkit_macos.tar.gz binary_patcher_rs
          - os: windows
            runner: windows-latest
            ext: ".exe"
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm

      - name: Build release
        run: cargo build --release

      - name: Package (Unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p binary_patcher_rs
          cp target/release/binary_patcher${{ matrix.ext }} binary_patcher_rs/
          cp target/release/apply_patch${{ matrix.ext }} binary_patcher_rs/
          cp target/release/rollback_patch${{ matrix.ext }} binary_patcher_rs/
          ${{ matrix.archive_cmd }}

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $stage = "binary_patcher_rs"
          New-Item -ItemType Directory -Path $stage -Force
          Copy-Item "target\release\binary_patcher.exe" -Destination $stage
          Copy-Item "target\release\apply_patch.exe" -Destination $stage
          Copy-Item "target\release\rollback_patch.exe" -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "binary_patcher_rs_toolkit_windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-patcher-${{ matrix.os }}
          path: binary_patcher_rs_toolkit_${{ matrix.os }}.${{ matrix.archive_ext }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release_files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release_files/ \;

      - name: Extract changelog entry
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1 }
            found && $0 ~ "^## \\[" && $0 !~ "^## \\[" tag "\\]" { exit }
            found
          ' CHANGELOG.md > release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          body_path: release_body.md
