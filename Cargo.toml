[package]
name = "binary_patcher"
version = "1.2.0"
edition = "2024"
description = "A small tool for creating and applying binary patches with HDiffPatch"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
hex = "0.4"
walkdir = "2"
anyhow = "1"
chrono = "0.4"

[build-dependencies]
cc = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
zip = "2"


[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
ptr_as_ptr = { level = "allow", priority = 1 }
borrow_as_ptr = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

[[bin]]
name = "binary_patcher"
path = "src/main.rs"

[[bin]]
name = "apply_patch"
path = "src/bin/apply_patch.rs"

[[bin]]
name = "rollback_patch"
path = "src/bin/rollback_patch.rs"
