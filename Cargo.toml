[package]
name = "binary_patcher"
version = "1.0.6"
edition = "2024"
description = "A small tool for creating and applying binary patches with HDiffPatch"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
walkdir = "2"
anyhow = "1"
chrono = "0.4"
atty = "0.2"

[build-dependencies]
cc = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
zip = "2"


[dev-dependencies]
tempfile = "3"

[[bin]]
name = "binary_patcher"
path = "src/main.rs"

[[bin]]
name = "apply_patch"
path = "src/bin/apply_patch.rs"

[[bin]]
name = "rollback_patch"
path = "src/bin/rollback_patch.rs"
